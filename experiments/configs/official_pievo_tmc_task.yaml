task: |
  Transition Metal Complex Optimization (TMC)

  Select exactly four ligand IDs from the released 50-ligand pool to form a
  neutral Pd(II) complex. The candidate string must have this exact form:
    Pd_L1_L2_L3_L4
  Each ligand ID must be copied exactly from the pool below. The four ligand
  charges must sum to -2. The objective is to maximize predicted electronic
  polarizability. The experiment tool returns the only numeric observation.

  [Released ligand pool]
